[workspace]
resolver = "2"
members = [
    "compiler",
    "project",
    "runtime",
    "backend",
    "linker",
    "cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VB6 Open Compiler Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Axiomedes/VB6-x64-Open-Compiler"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
tempfile = "3.8"
